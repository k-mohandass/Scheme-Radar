services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: schemesaathi
      MYSQL_USER: schemesaathi_user
      MYSQL_PASSWORD: change-me-local-password
      MYSQL_ROOT_PASSWORD: change-me-root-password
    ports:
      - "3306:3306"
    volumes:
      - schemesaathi_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  schemesaathi_mysql:
